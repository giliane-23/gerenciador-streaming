<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Cliente</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="background">
        <div class="overlay">
            <div class="painel">
                <h1 class="cadastrar">Novo Cliente</h1>
                <form id="formCliente">
                    <label>Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Nome ">

                    <label>Telefone</label>
                    <input type="text" id="telefone" name="telefone" placeholder="Telefone" maxlength="15">

                    <label>Painel de Streaming</label>
                    <input type="text" id="painel" name="painel" placeholder="Painel de Streaming ">

                    <label>Quantidades de Telas</label>
                    <input type="number" id="telas" name="telas" placeholder="Quantidades de Telas" min="0" step="1">

                    <label>Valor do Plano</label>
                    <input type="text" inputmode="numeric" id="valorplano" placeholder="R$0,00">


                    <div class=" form-group">
                        <div class="direito">
                            <label>Vencimento</label>
                            <input type="date" id="vencimento" name="vencimento" placeholder="vencimento">
                        </div>


                        <div class="esquerdo">
                            <label>Status</label>
                            <select name="Status" id="status">

                                <option value="Ativo">Ativo</option>
                                <option value="Inativo">Inativo</option>

                            </select>
                        </div>

                    </div>
                    <button type="submit" id="button-salvar">Salvar</button>
                </form>
            </div>
            <script src="js/script.js"></script>

            <footer class="copyright">
                <p>&copy; 2026 Mega IPTV - Todos os direitos reservados.</p>
            </footer>

            <div class="logo-home">
                <a href="index.html">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                    </svg>
                    <span class="home">Home</span>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
